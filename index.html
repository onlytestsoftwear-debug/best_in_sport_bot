<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FCF4E9">
<title>Лучшие в спорте 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<!-- MAX Bridge (необязательно). Если скрипт не загрузится, страница работает как обычный сайт.
     Проверьте актуальный адрес скрипта в документации MAX (dev.max.ru, раздел «Мини-приложения»). -->
<script src="https://st.max.ru/js/max-web-app.js" async></script>

<style>
:root{
  --ivory:#FCF4E9;
  --champagne:#F3E5D0;
  --sand:#E6D0B0;
  --gold:#C39A5B;
  --gold-light:#DDBB82;
  --bronze:#8F6234;
  --ink:#43301C;
  --ink-soft:#6B5439;
  --line:#D8BD92;
  --focus:#6E4414;
  --bar-h:56px;
  color-scheme: light;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html{background:#F8EBD8;-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--bar-h) + env(safe-area-inset-top,0px) + 12px)}
body{
  margin:0;
  font-family:'Montserrat','Segoe UI',Roboto,system-ui,-apple-system,Arial,sans-serif;
  font-size:16px;line-height:1.6;color:var(--ink);
  background:
    radial-gradient(120% 60% at 50% 0%, #FFFBF4 0%, rgba(255,251,244,0) 70%),
    linear-gradient(180deg,var(--ivory) 0%,#F8EBD8 100%);
  padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100vh;
}
h1,h2,h3,p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ---------- верхняя панель ---------- */
.bar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  padding-top:env(safe-area-inset-top,0px);
  background:rgba(252,244,233,.94);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.bar-in{height:var(--bar-h);max-width:760px;margin:0 auto;padding:0 8px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center}
.bar-title{text-align:center;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;border-radius:50%;cursor:pointer;color:var(--bronze)}
.icon-btn[hidden]{display:none}
.icon-btn:active{background:var(--champagne)}
.icon-btn svg{width:24px;height:24px}

main{max-width:760px;margin:0 auto;padding:calc(var(--bar-h) + env(safe-area-inset-top,0px)) 0 48px}
.pad{padding-left:20px;padding-right:20px}

/* ---------- заголовки с линиями, как в превью ---------- */
.title{
  display:grid;grid-template-columns:minmax(10px,1fr) auto minmax(10px,1fr);align-items:center;gap:14px;
  margin:44px 0 22px;
}
.title::before,.title::after{content:"";height:1px;background:linear-gradient(90deg,transparent,var(--gold));}
.title::after{background:linear-gradient(90deg,var(--gold),transparent)}
.title h2{
  font-size:clamp(17px,4.8vw,22px);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--bronze);text-align:center;line-height:1.3;max-width:16em;
}
.page-title{margin:30px 0 8px;text-align:center}
.page-title h1{font-size:clamp(22px,6.4vw,30px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--bronze);line-height:1.25}
.page-lead{text-align:center;color:var(--ink-soft);font-size:15px;max-width:34em;margin:10px auto 0}
.rule{display:block;width:120px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* ---------- главный экран ---------- */
/* Превью не лежит отдельной картинкой: сверху и снизу оно растворяется в фоне страницы,
   золотые линии продолжаются в содержимое, кнопка «Проголосовать» стоит поверх размытого края. */
.hero{margin:0 0 -44px;position:relative;z-index:0}
.hero img{
  display:block;width:100%;height:auto;aspect-ratio:1.5;object-fit:cover;object-position:50% 40%;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 11%,#000 70%,transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 11%,#000 70%,transparent 100%);
}
.hero-flow{position:absolute;left:0;right:0;bottom:0;width:100%;height:96px;pointer-events:none}
@media (min-width:700px){
  .hero img{
    aspect-ratio:1.9;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 11%,#000 70%,transparent 100%),linear-gradient(to right,transparent 0,#000 12%,#000 88%,transparent 100%);
    -webkit-mask-composite:source-in;
            mask-image:linear-gradient(to bottom,transparent 0,#000 11%,#000 70%,transparent 100%),linear-gradient(to right,transparent 0,#000 12%,#000 88%,transparent 100%);
            mask-composite:intersect;
  }
}
.cta-wrap{padding:22px 20px 0;display:grid;gap:12px;justify-items:center;position:relative;z-index:1}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:52px;padding:0 28px;border-radius:999px;border:1px solid transparent;cursor:pointer;
  font-weight:600;font-size:15px;letter-spacing:.06em;text-decoration:none;text-align:center;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn-gold{
  color:#3A2610;
  background:linear-gradient(135deg,#E8CB93 0%,#C9A062 48%,#B78B4A 100%);
  box-shadow:0 6px 18px rgba(143,98,52,.28), inset 0 1px 0 rgba(255,255,255,.55);
}
.btn-gold:active{transform:translateY(1px);box-shadow:0 2px 8px rgba(143,98,52,.28)}
.btn-line{color:var(--bronze);background:transparent;border-color:var(--gold)}
.btn-line:active{background:var(--champagne)}
.btn-wide{width:100%;max-width:420px}

.prose p{color:var(--ink);margin-bottom:14px;max-width:38em}
.prose p:last-child{margin-bottom:0}
.prose{text-align:left}
.placeholder{color:var(--ink-soft)}

/* ---------- дорожная карта ---------- */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:1px;background:linear-gradient(180deg,var(--gold),var(--line))}
.timeline li{position:relative;padding:0 0 26px 40px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{
  content:"";position:absolute;left:4px;top:6px;width:15px;height:15px;border-radius:50%;
  background:var(--ivory);border:2px solid var(--gold);
}
.timeline li.now::before{background:linear-gradient(135deg,#E8CB93,#B78B4A);border-color:var(--bronze);box-shadow:0 0 0 5px rgba(195,154,91,.22)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.tl-now{display:none}.now .tl-now{display:inline}
.tl-date{font-weight:700;color:var(--bronze);font-size:15px}
.tl-name{font-weight:600;margin-top:2px}
.tl-text{color:var(--ink-soft);font-size:14.5px;margin-top:4px}

/* ---------- как проголосовать ---------- */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{
  counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;
  padding:16px 16px 16px 14px;background:rgba(255,251,244,.7);border:1px solid var(--line);border-radius:6px;
}
.steps li::before{
  content:counter(s);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:18px;color:var(--bronze);border:1.5px solid var(--gold);
  background:radial-gradient(circle at 30% 25%,#FFF7E8,#F1DDB9);
}
.steps b{display:block;font-weight:600;margin-bottom:2px}
.steps span{color:var(--ink-soft);font-size:14.5px}
.note{margin-top:14px;font-size:13.5px;color:var(--ink-soft);text-align:center}

/* ---------- строки-ссылки (номинации, разделы, документы) ---------- */
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.rows li{border-bottom:1px solid var(--line)}
.row{
  display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;
  width:100%;padding:16px 4px;background:transparent;border:0;text-align:left;text-decoration:none;cursor:pointer;color:inherit;
}
.row:active{background:rgba(243,229,208,.6)}
.row-name{font-weight:600;font-size:16.5px;line-height:1.3;color:var(--ink);overflow-wrap:anywhere}
.row-sub{display:block;font-size:13.5px;color:var(--ink-soft);margin-top:3px;font-weight:400}
.chev{width:20px;height:20px;color:var(--gold)}

.big-links{display:grid;gap:14px;margin-top:6px}
.big-link{
  display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  padding:20px 20px;text-decoration:none;color:var(--ink);
  background:linear-gradient(135deg,#FFFBF3 0%,#F4E4CA 100%);
  border:1px solid var(--gold);border-radius:6px;
  box-shadow:0 8px 22px rgba(143,98,52,.14);
}
.big-link:active{transform:translateY(1px)}
.big-link b{display:block;font-size:17px;font-weight:700;letter-spacing:.04em;color:var(--bronze);line-height:1.3}
.big-link span{display:block;font-size:13.5px;color:var(--ink-soft);margin-top:4px}

/* ---------- значок-логотип номинации ---------- */
.badge{width:56px;height:56px;flex:none}
.badge-lg{width:112px;height:112px;display:block;margin:0 auto}
.logo-img{width:56px;height:56px;object-fit:contain;border-radius:50%}
.logo-img.lg{width:112px;height:112px;display:block;margin:0 auto}

/* ---------- детали номинации ---------- */
.panel{padding:18px 18px;background:rgba(255,251,244,.75);border:1px solid var(--line);border-radius:6px}
.panel h3{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--bronze);margin-bottom:8px}
.panel p{font-size:15px;color:var(--ink)}
.panel .btn{margin-top:14px;min-height:46px;font-size:14px}
.panel p+p{margin-top:8px}
.dl{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:center;margin-top:14px;padding:12px 14px;text-decoration:none;color:var(--ink);
  border:1px solid var(--gold);border-radius:6px;background:linear-gradient(135deg,#FFFBF3,#F4E4CA)}
.dl:active{transform:translateY(1px)}
.dl-ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#3A2610;
  background:linear-gradient(135deg,#E8CB93 0%,#C9A062 48%,#B78B4A 100%);box-shadow:0 4px 12px rgba(143,98,52,.28),inset 0 1px 0 rgba(255,255,255,.55)}
.dl-ico svg{width:24px;height:24px}
.dl-text b{display:block;font-weight:600;font-size:15px;color:var(--bronze)}
.dl-text span{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px}
.panel .reg-soon{margin-top:12px;font-size:13.5px;color:var(--ink-soft);font-style:italic}
.subs{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.sub{padding:16px 18px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(135deg,#FFFBF3,#F7EAD3)}
.sub h3{font-size:16px;font-weight:600;line-height:1.35}
.sub p{font-size:14.5px;color:var(--ink-soft);margin-top:4px}
.sub .btn{margin-top:12px;min-height:44px;padding:0 20px;font-size:13.5px}

/* ---------- лучшие моменты ---------- */
.moments{display:grid;gap:16px;grid-template-columns:1fr;margin:0;padding:0;list-style:none}
.moment{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:rgba(255,251,244,.8)}
.moment-media{
  aspect-ratio:16/9;display:grid;place-items:center;color:var(--bronze);text-align:center;padding:12px;
  background:
    linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 40%),
    linear-gradient(160deg,#EBD6B3,#D9BC8C);
  font-size:13.5px;font-weight:500;
}
.moment-media img{width:100%;height:100%;object-fit:cover;display:block}
.moment-body{padding:14px 16px 16px}
.moment-body h3{font-size:16px;font-weight:600;line-height:1.35}
.moment-body p{font-size:14.5px;color:var(--ink-soft);margin-top:4px}
.moment-body a{display:inline-block;margin-top:10px;font-weight:600;color:var(--bronze);font-size:14px}

/* ---------- документы ---------- */
.doc-ico{width:40px;height:48px;color:var(--gold)}

/* ---------- лента и подвал ---------- */
.ribbon{display:block;width:100%;height:64px;margin-top:40px}
footer{max-width:760px;margin:0 auto;padding:6px 20px 32px;text-align:center;color:var(--bronze)}
footer b{display:block;font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:12.5px}
footer span{display:block;font-size:13px;color:var(--ink-soft);margin-top:4px;letter-spacing:.08em}

/* ---------- меню ---------- */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(67,48,28,.38);opacity:0;pointer-events:none;transition:opacity .2s ease}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(86vw,360px);
  background:var(--ivory);border-left:1px solid var(--gold);
  padding:calc(env(safe-area-inset-top,0px) + 8px) 0 calc(env(safe-area-inset-bottom,0px) + 16px);
  transform:translateX(102%);transition:transform .22s ease;overflow-y:auto;visibility:hidden;
}
.sheet.open{transform:none;visibility:visible}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:0 8px 0 20px;height:48px}
.sheet-head b{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--bronze)}
.sheet nav{padding:6px 12px}
.sheet nav a{display:block;padding:13px 10px;text-decoration:none;font-weight:500;border-bottom:1px solid rgba(216,189,146,.55)}
.sheet nav a.sub-item{padding-left:26px;font-size:14.5px;color:var(--ink-soft);font-weight:400}
.sheet nav a.current{color:var(--bronze);font-weight:700}
.sheet nav .gap{height:10px;border:0}
.sheet .btn{margin:16px 20px 0;width:calc(100% - 40px)}

/* смена экранов: только ответ на действие человека */
.view{animation:enter .22s ease}
@keyframes enter{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .view{animation:none}.sheet,.sheet-bg,.btn{transition:none}
}
@media (min-width:640px){
  .moments{grid-template-columns:1fr 1fr}
  .pad{padding-left:28px;padding-right:28px}
}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <button class="icon-btn" id="back" type="button" aria-label="Назад" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span id="home-spacer"></span>
    <div class="bar-title" id="bar-title">Лучшие в спорте</div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h16M4 16h16"/></svg>
    </button>
  </div>
</header>

<div class="sheet-bg" id="menu-bg"></div>
<aside class="sheet" id="menu" aria-label="Меню" aria-hidden="true">

    <b>Меню</b>
    <button class="icon-btn" id="menu-close" type="button" aria-label="Закрыть меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <nav id="menu-nav"></nav>
  <a class="btn btn-gold" id="menu-vote" data-bot href="#">Проголосовать</a>

<main id="view" tabindex="-1"></main>

<footer>
  <svg class="ribbon" viewBox="0 0 760 64" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="rg" x1="0" x2="1">
        <stop offset="0" stop-color="#B78B4A" stop-opacity="0"/><stop offset=".25" stop-color="#C9A062"/>
        <stop offset=".55" stop-color="#EBD29B"/><stop offset=".8" stop-color="#B78B4A"/><stop offset="1" stop-color="#B78B4A" stop-opacity="0"/>
      </linearGradient>

    <path d="M0 44 C 140 4, 260 62, 400 34 S 640 10, 760 38" fill="none" stroke="url(#rg)" stroke-width="2.4"/>
    <path d="M0 52 C 150 18, 270 64, 410 44 S 650 24, 760 48" fill="none" stroke="url(#rg)" stroke-width="1.2" opacity=".8"/>
    <path d="M0 36 C 130 -4, 250 56, 390 26 S 630 2, 760 30" fill="none" stroke="url(#rg)" stroke-width=".8" opacity=".6"/>
  </svg>
  <b>Нижегородская область</b>
  <span>Лучшие в спорте · 2026</span>
</footer>

<script>
/* =====================================================================
   ДАННЫЕ. Всё содержимое страницы меняется только в этом блоке.
   Тексты в квадратных скобках [...] - заглушки, замените их своими.
   ===================================================================== */

const CONFIG = {
  // Ссылка на бота (формат диплинков MAX: https://max.ru/ИМЯ_БОТА?start=...)
  botLink: "https://max.ru/best_in_sport_bot",
  siteTitle: "Лучшие в спорте",
  hero: "assets/preview.jpg"
};

const EVENT = {
  about: [
    "[Здесь будет описание мероприятия: что это за событие, кто его организует, какова цель.]",
    "[Второй абзац: кто может быть номинантом, кто выбирает победителей, как пройдёт церемония награждения.]"
  ],
  // from / to - даты этапа включительно (ГГГГ-ММ-ДД, по московскому времени).

  roadmap: [
    { date: "с 5 ноября 2026 по 15 ноября 2026", from: "2026-11-05", to: "2026-11-15", name: "Подача заявок",
      text: "Заявки на участие могут быть поданы любыми физкультурно-спортивными организациями Нижегородской области, физическими лицами, проживающими на территории Нижегородской области" },
    { date: "до 18 ноября 2026", from: "2026-11-16", to: "2026-11-18", name: "Заседание комиссии",
      text: "Комиссия определяет не менее 5 кандидатов по номинациям для участия в онлайн голосовании" },
    { date: "с 20 ноября 2026 по 30 ноября 2026", from: "2026-11-20", to: "2026-11-30", name: "Онлайн голосование",
      text: "Голосование проходит в чат-боте. В каждой категории можно отдать один голос. По наибольшему количеству голосов определяются 3 лучших кандидата для обсуждения на заседании комиссии" },
    { date: "до 2 декабря 2026", from: "2026-12-01", to: "2026-12-02", name: "Заседание комиссии",
      text: "Комиссия определяет и утверждает победителей и призеров по номинациям." },
    { date: "до 6 декабря 2026", from: "2026-12-03", to: "2026-12-06", name: "Итоги конкурса", text: "" },
    { date: "17 декабря 2026", from: "2026-12-17", to: "2026-12-17", name: "Церемония награждения",
      text: "Стадион Нижний Новгород 19:00" }
  ],
  roadmapNote: "Сроки проведения этапов могут быть скорректированы, ввиду технических особенностей процесса проведения.",
  howto: [
    { title: "Откройте бота", text: "Нажмите «Проголосовать» на этой странице: откроется чат с ботом голосования." },
    { title: "Выберите номинацию", text: "Если у номинации есть подноминации, выберите нужную." },
    { title: "Выберите номинанта", text: "Посмотрите карточку с фото и описанием и подтвердите выбор." },
    { title: "Проголосуйте в других категориях", text: "В каждой категории доступен один голос. После подтверждения изменить его нельзя." }
  ],
  howtoNote: "Онлайн голосование: с 20 по 30 ноября 2026 года."
};

function badge(nom, big) {
  if (nom.logo) return `<img class="logo-img${big ? " lg" : ""}" src="${esc(nom.logo)}" alt="">`;
  const gid = "bg" + nom.id + (big ? "L" : "S");
  const letter = esc(nom.title.trim().charAt(0).toUpperCase());
  return `<svg class="${big ? "badge-lg" : "badge"}" viewBox="0 0 112 112" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2DDB0"/><stop offset=".5" stop-color="#C9A062"/><stop offset="1" stop-color="#9B6F36"/></linearGradient></defs>
    <circle cx="56" cy="56" r="53" fill="#FFF8EA" stroke="url(#${gid})" stroke-width="3"/>
    <circle cx="56" cy="56" r="45" fill="none" stroke="#D8BD92" stroke-width="1"/>
    <text x="56" y="74" text-anchor="middle" font-family="Montserrat,Segoe UI,Arial,sans-serif" font-weight="700" font-size="52" fill="url(#${gid})">${letter}</text>
  </svg>`;
}

function botUrl(payload) {
  return CONFIG.botLink + (payload ? (CONFIG.botLink.includes("?") ? "&" : "?") + "start=" + encodeURIComponent(payload) : "");
}
function botBtn(label, payload, cls) {
  return `<a class="btn ${cls || "btn-gold"}" data-bot href="${esc(botUrl(payload))}">${esc(label)}</a>`;
}
function openBot(url) {
  try {
    if (WA && typeof WA.openMaxLink === "function") { WA.openMaxLink(url); return; }
    if (WA && typeof WA.openLink === "function") { WA.openLink(url); return; }
  } catch (e) { /* переходим обычной ссылкой */ }
  window.location.href = url;
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-bot]");
  if (a) { e.preventDefault(); openBot(a.getAttribute("href")); }
});

function renderNomination(id) {
  const n = NOMINATIONS.find(x => x.id === id);
  if (!n) return renderNominations();
  let reg = "";
  if (n.regulation) {
    const paras = [].concat(n.regulation.text || []).map(t => `<p class="${String(t).startsWith("[") ? "placeholder" : ""}">${esc(t)}</p>`).join("");
    const dl = n.regulation.url
      ? `<a class="dl" href="${esc(n.regulation.url)}" download target="_blank" rel="noopener">
           <span class="dl-ico">${ICON_DL}</span>
           <span class="dl-text"><b>${esc(n.regulation.label || "Скачать положение")}</b>${n.regulation.note ? `<span>${esc(n.regulation.note)}</span>` : ""}</span></a>`
      : `<p class="reg-soon">Текст положения будет опубликован на этой странице.</p>`;
    reg = `<div class="panel" style="margin-top:16px"><h3>Положение</h3>${paras}${dl}</div>`;
  }
  let tail = "";
  if (n.subs.length) {
    tail = `<div class="title"><h2>Подноминации</h2></div>
      <ul class="subs">${n.subs.map(s => `<li class="sub"><h3>${esc(s.title)}</h3><p>${esc(s.description)}</p>
        ${s.key ? botBtn("Голосовать", s.key, "btn-gold") : ""}</li>`).join("")}</ul>`;
  } else if (n.key) {
    tail = `<div class="cta-wrap" style="padding-top:26px">${botBtn("Проголосовать в этой номинации", n.key, "btn-gold btn-wide")}</div>`;
  }
  return `
    <div class="page-title pad">${badge(n, true)}<h1 style="margin-top:16px">${esc(n.title)}</h1><span class="rule"></span></div>
    <div class="pad" style="margin-top:24px">
      <div class="panel"><h3>О номинации</h3><p class="${n.description.startsWith("[") ? "placeholder" : ""}">${esc(n.description)}</p></div>
      ${reg}
      ${tail}
    </div>`;
}

function plural(n, a, b, c) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return a;
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b;
  return c;
}

/* ---------- дорожная карта: подсветка текущего этапа ---------- */
function todayMsk() {
  // сегодняшняя дата по Москве в формате ГГГГ-ММ-ДД, не зависит от часового пояса телефона
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Moscow", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
}
function updateRoadmapNow() {
  const today = todayMsk();
  document.querySelectorAll(".timeline li").forEach(li => {
    const from = li.dataset.from, to = li.dataset.to;
    li.classList.toggle("now", !!from && !!to && today >= from && today <= to);
  });
}
setInterval(updateRoadmapNow, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) updateRoadmapNow(); });

function setMenu(open) {
  menu.classList.toggle("open", open);
  menuBg.classList.toggle("open", open);
  menu.setAttribute("aria-hidden", String(!open));
  menuBtn.setAttribute("aria-expanded", String(open));
  if (open) $("#menu-close").focus();
}

  if (h === "nominations") { page = "nominations"; html = renderNominations(); barTitle = "Номинации"; }
  else if (h.startsWith("nomination-")) { page = h; html = renderNomination(h.slice(11)); barTitle = "Номинация"; current = "#nominations"; }
  else if (h === "moments") { page = "moments"; html = renderMoments(); barTitle = "Лучшие моменты"; }
  else if (h === "docs") { page = "docs"; html = renderDocs(); barTitle = "НПА"; }
  else { page = "home"; if (!ANCHORS.includes(h)) current = "#home"; }

  if (page !== lastPage) {
    view.innerHTML = page === "home" ? renderHome() : html;
    view.classList.remove("view"); void view.offsetWidth; view.classList.add("view");
    if (!(page === "home" && ANCHORS.includes(h))) window.scrollTo(0, 0);
    updateRoadmapNow();
  }
  if (page === "home" && ANCHORS.includes(h)) {
    const el = document.getElementById(h);
    if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start" });
  }
  lastPage = page;

  $("#bar-title").textContent = barTitle;
  const isHome = page === "home";
  $("#back").hidden = isHome;
  $("#home-spacer").hidden = !isHome;
  document.title = (isHome ? "" : barTitle + " - ") + "Лучшие в спорте 2026";
  buildMenu(current);
  try { if (WA && WA.BackButton) { isHome ? WA.BackButton.hide() : WA.BackButton.show(); } } catch (e) {}
}

function goBack() {
  if (history.length > 1) history.back(); else location.hash = "#home";
}
$("#back").addEventListener("click", goBack);
try { if (WA) { WA.ready && WA.ready(); WA.BackButton && WA.BackButton.onClick && WA.BackButton.onClick(goBack); } } catch (e) {}

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
